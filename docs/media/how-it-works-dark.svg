<rect x="32" y="32" width="340" height="276" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/><text x="56" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">Your sources</text><text x="56" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F1F5F9">Git: commits and docs</text><text x="56" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F1F5F9">GitHub: PRs, reviews, issues</text><text x="56" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F1F5F9">Linear · Notion · Discord</text><text x="56" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#94A3B8">Azure DevOps · Jira</text><text x="56" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#94A3B8">Confluence · Slack · Teams</text><text x="56" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#94A3B8">(coming in v0.4)</text>
<rect x="470" y="32" width="340" height="276" rx="16" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/><text x="494" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">Waymark</text><text x="494" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F1F5F9">Markdown wiki, versioned in git</text><text x="494" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F1F5F9">SQLite full-text + vector index</text><text x="494" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F1F5F9">Agent sessions and handoffs</text><text x="494" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#F1F5F9">Every answer links its source</text><text x="494" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#94A3B8">Own identity at every source</text><text x="494" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#94A3B8">No LLM needed by default</text>
